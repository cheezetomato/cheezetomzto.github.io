<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Cinema Archive</title>
    <!-- 폰트 로드 -->
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script> <!-- 아이콘용 -->
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

    <style>
        :root {
            --bg-color: #141414; /* 넷플릭스/레터박스 스타일 다크 톤 */
            --header-bg: rgba(20, 20, 20, 0.9);
            --text-light: #e5e5e5;
            --text-muted: #808080;
            --star-color: #00e054; /* 레터박스 그린 포인트 */
            --border-color: #2c2c2c;
        }

        body {
            font-family: 'Pretendard', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-light);
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        /* 네비게이션 헤더 */
        header {
            position: fixed;
            top: 0;
            width: 100%;
            height: 70px;
            background: var(--header-bg);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 40px;
            box-sizing: border-box;
            z-index: 1000;
            border-bottom: 1px solid var(--border-color);
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 1px;
            cursor: pointer;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .search-bar {
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            background: #222;
            color: #fff;
            font-family: 'Pretendard', sans-serif;
            outline: none;
        }

        .btn {
            background: transparent;
            color: var(--text-light);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            transition: 0.2s;
            font-weight: 600;
        }
        .btn:hover { background: rgba(255,255,255,0.1); }

        /* 5점 만점 히어로 슬라이더 */
        .hero-slider {
            margin-top: 70px;
            height: 60vh;
            background: #000;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        
        .hero-content {
            position: absolute;
            bottom: 40px;
            left: 50px;
            z-index: 10;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.8);
        }
        .hero-content h1 { font-size: 3rem; margin: 0 0 10px 0; }
        .hero-content p { font-size: 1.2rem; margin: 0; color: var(--text-muted); }

        .hero-bg {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.5;
        }

        /* 섹션 및 캐러셀 레이아웃 */
        .section-container {
            padding: 40px 50px;
        }

        .section-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .carousel-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .carousel {
            display: flex;
            gap: 15px;
            overflow-x: auto;
            scroll-behavior: smooth;
            padding-bottom: 20px;
            /* 6개씩 보이도록 아이템 크기 계산 (gap 포함) */
        }
        .carousel::-webkit-scrollbar { display: none; }

        .movie-card {
            flex: 0 0 calc((100% - 75px) / 6); /* 6 item grid */
            position: relative;
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.3s ease;
            cursor: pointer;
            border: 1px solid var(--border-color);
        }
        
        .movie-card:hover {
            transform: scale(1.05);
            z-index: 2;
            border-color: var(--star-color);
        }

        .movie-poster {
            width: 100%;
            aspect-ratio: 2 / 3;
            object-fit: cover;
            display: block;
        }

        .movie-info {
            position: absolute;
            bottom: 0; left: 0; width: 100%;
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
            padding: 15px 10px 10px;
            box-sizing: border-box;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .movie-card:hover .movie-info { opacity: 1; }

        .movie-title { font-size: 14px; font-weight: bold; margin: 0 0 5px 0; }
        .movie-director { font-size: 12px; color: var(--text-muted); }
        .movie-rating { 
            color: var(--star-color); 
            font-size: 13px; 
            margin-top: 5px; 
            font-weight: bold;
        }

        /* 페이지네이션 버튼 */
        .nav-btn {
            background: rgba(0,0,0,0.5);
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            position: absolute;
            z-index: 10;
            height: 100%;
            padding: 0 15px;
            transition: background 0.2s;
        }
        .nav-btn:hover { background: rgba(0,0,0,0.8); }
        .nav-prev { left: -40px; }
        .nav-next { right: -40px; }

    </style>
</head>
<body>

    <header>
        <div class="logo" onclick="location.href='index.html'">🍿 CheezeTomato Archives</div>
        <div class="header-controls">
            <input type="text" class="search-bar" id="searchInput" placeholder="영화 제목 검색... (로컬/TMDB)">
            <button class="btn" id="adminBtn" onclick="toggleAdmin()">관리자 로그인</button>
            <button class="btn" onclick="location.href='index.html'">메인으로</button>
        </div>
    </header>

    <!-- 5점 만점 마스터피스 히어로 섹션 -->
    <div class="hero-slider" id="heroSlider">
        <!-- JS로 채워질 영역 (예: 타오르는 여인의 초상, 버닝, 화양연화 등) -->
        <img src="" alt="Hero Background" class="hero-bg" id="heroBg">
        <div class="hero-content">
            <h1 id="heroTitle">최고의 영화들</h1>
            <p id="heroDesc">★★★★★ Masterpieces</p>
        </div>
    </div>

    <!-- 평점별 영화 캐러셀 영역 -->
    <div id="movieSections">
        <!-- JS가 평점별(5.0, 4.5, 4.0 등)로 섹션을 자동 생성합니다. -->
    </div>

<script>
    // ---------------------------------
    // 1. 설정 및 초기화 (본인 키로 변경 필수)
    // ---------------------------------
    const TMDB_API_KEY = "여기에_TMDB_API_KEY_입력";
    
    const firebaseConfig = {
        apiKey: "여기에_FIREBASE_API_KEY_입력",
        authDomain: "여기에_PROJECT_ID.firebaseapp.com",
        databaseURL: "여기에_DATABASE_URL_입력",
        projectId: "여기에_PROJECT_ID"
    };
    
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();
    const auth = firebase.auth();

    // ---------------------------------
    // 2. 데이터 불러오기 및 렌더링
    // ---------------------------------
    function loadMovies() {
        db.ref('movies').once('value').then((snapshot) => {
            const data = snapshot.val();
            if (!data) return;

            // 영화 데이터를 배열로 변환
            let movies = Object.keys(data).map(key => ({
                id: key,
                ...data[key]
            }));

            // 평점 내림차순 정렬
            movies.sort((a, b) => b.rating - a.rating);

            renderHeroSlider(movies.filter(m => m.rating === 5));
            renderCarousels(movies);
        });
    }

    // 상단 5점 만점 히어로 렌더링
    function renderHeroSlider(fiveStarMovies) {
        if(fiveStarMovies.length === 0) return;
        
        // 간단히 첫 번째 5점 영화나 랜덤으로 하나를 메인에 표시
        const hero = fiveStarMovies[Math.floor(Math.random() * fiveStarMovies.length)];
        
        document.getElementById('heroTitle').textContent = hero.title;
        // TMDB 백드롭 이미지가 있다면 적용, 없으면 포스터
        document.getElementById('heroBg').src = hero.backdropUrl || hero.posterUrl;
    }

    // 평점별로 그룹화하여 캐러셀 생성
    function renderCarousels(movies) {
        const sectionsContainer = document.getElementById('movieSections');
        sectionsContainer.innerHTML = '';

        // 평점(0.5 단위)으로 그룹화
        const grouped = {};
        movies.forEach(movie => {
            if(!grouped[movie.rating]) grouped[movie.rating] = [];
            grouped[movie.rating].push(movie);
        });

        // 5.0부터 역순으로 렌더링
        Object.keys(grouped).sort((a, b) => b - a).forEach(rating => {
            const section = document.createElement('div');
            section.className = 'section-container';

            // 별점 문자열 생성 (예: ★★★★☆)
            let stars = '★'.repeat(Math.floor(rating));
            if (rating % 1 !== 0) stars += '½';

            let html = `
                <div class="section-title">${stars} <span style="color:var(--text-muted); font-size:14px;">(${rating}점)</span></div>
                <div class="carousel-wrapper">
                    <button class="nav-btn nav-prev" onclick="scrollCarousel('${rating}', -1)">‹</button>
                    <div class="carousel" id="carousel-${rating}">
            `;

            grouped[rating].forEach(movie => {
                html += `
                    <div class="movie-card">
                        <img src="${movie.posterUrl}" alt="${movie.title}" class="movie-poster" onerror="this.src='https://via.placeholder.com/200x300?text=No+Poster'">
                        <div class="movie-info">
                            <p class="movie-title">${movie.title}</p>
                            <p class="movie-director">${movie.director || '감독 미상'}</p>
                            <p class="movie-rating">${stars}</p>
                        </div>
                    </div>
                `;
            });

            html += `
                    </div>
                    <button class="nav-btn nav-next" onclick="scrollCarousel('${rating}', 1)">›</button>
                </div>
            `;
            section.innerHTML = html;
            sectionsContainer.appendChild(section);
        });
    }

    // 캐러셀 좌우 스크롤 로직
    window.scrollCarousel = function(rating, direction) {
        const carousel = document.getElementById(`carousel-${rating}`);
        const scrollAmount = carousel.clientWidth * 0.8; // 너비의 80%만큼 이동
        carousel.scrollBy({ left: scrollAmount * direction, behavior: 'smooth' });
    }

    // ---------------------------------
    // 3. TMDB 연동 및 검색기능 (퍼지 매칭)
    // ---------------------------------
    document.getElementById('searchInput').addEventListener('keyup', (e) => {
        const keyword = e.target.value.toLowerCase();
        // 검색 로직 (생략: 기존 코드처럼 로컬 movies 배열 filter 후 렌더링 수행)
        // TMDB 연동이 필요한 경우 fetch(`https://api.themoviedb.org/3/search/movie?api_key=${TMDB_API_KEY}&query=${keyword}`) 활용
    });

    // ---------------------------------
    // 4. 관리자 로그인 로직
    // ---------------------------------
    window.toggleAdmin = function() {
        const user = auth.currentUser;
        if (user) {
            auth.signOut().then(() => alert("로그아웃 되었습니다."));
        } else {
            const email = prompt("관리자 이메일을 입력하세요:");
            const pwd = prompt("비밀번호를 입력하세요:");
            if(email && pwd) {
                auth.signInWithEmailAndPassword(email, pwd)
                    .then(() => alert("관리자 로그인 성공! 영화 추가/수정 권한이 부여됩니다."))
                    .catch(err => alert("로그인 실패: " + err.message));
            }
        }
    }

    auth.onAuthStateChanged(user => {
        document.getElementById('adminBtn').textContent = user ? "관리자 로그아웃" : "관리자 로그인";
        // 로그인 시 우측 하단에 플로팅 '영화 추가(+)' 버튼 생성 등의 로직 추가 가능
    });

    // 초기 로드
    window.onload = loadMovies;

</script>
</body>
</html>
