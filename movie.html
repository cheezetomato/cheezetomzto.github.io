<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>지뢰찾기 Pro - Modern Dark (Cloud Save)</title>
    <style>
        /* 기존 CSS와 동일 (생략 없이 원본 유지) */
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        @import url('https://fonts.googleapis.com/css2?family=DSDIGIT&family=VT323&display=swap');

        :root {
            --bg-body: #121316;          
            --bg-sidebar: #1a1c20;       
            --bg-panel: #22252a;         
            
            --text-main: #8f959e;        
            --text-highlight: #60a5fa;   
            
            --grid-gap-color: #121316;   
            --cell-unrevealed: #3a3f47;  
            --cell-unrevealed-hover: #454b54; 
            --cell-revealed: #22252a;    
            --cell-highlight: #4d545e;   
            
            --digital-bg: #090a0c;
            --digital-text: #ef4444;
        }

        body {
            font-family: 'Pretendard', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        .top-header {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 60px;
            background-color: rgba(26, 28, 32, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            display: flex;
            align-items: center;
            padding: 0 30px;
            box-sizing: border-box;
            z-index: 10;
        }
        .top-header .logo {
            font-size: 22px;
            font-weight: 800;
            color: #fff;
            letter-spacing: -0.5px;
        }

        .sidebar {
            width: 260px;
            background-color: var(--bg-sidebar);
            border-right: 1px solid rgba(255,255,255,0.05);
            padding-top: 90px; 
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-sizing: border-box;
        }
        
        .sidebar-section {
            display: flex;
            flex-direction: column;
            padding: 0 20px;
        }

        .menu-btn {
            background: none;
            border: none;
            color: var(--text-main);
            text-align: left;
            padding: 12px 15px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            border-radius: 12px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .menu-btn:hover { background-color: rgba(255,255,255,0.03); color: #fff; }
        .menu-btn.active { 
            background-color: rgba(96, 165, 250, 0.1); 
            color: var(--text-highlight); 
            font-weight: 700; 
        }

        .main-content {
            flex: 1;
            padding-top: 90px;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-y: auto;
        }

        #game-view {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #record-view {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 600px;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .diff-nav {
            display: flex;
            background: var(--bg-sidebar);
            padding: 6px;
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.05);
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .diff-nav button {
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 14px;
            font-weight: 600;
            padding: 8px 24px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        .diff-nav button:hover { color: #fff; }
        .diff-nav button.active { 
            background: var(--text-highlight); 
            color: #fff; 
            box-shadow: 0 2px 10px rgba(96, 165, 250, 0.3);
        }

        .panel-wrapper {
            background-color: var(--bg-panel);
            padding: 25px;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.05);
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
            display: inline-block;
            width: 100%;
            box-sizing: border-box;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.2);
            padding: 12px 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.02);
        }

        .digital-display {
            background-color: var(--digital-bg);
            color: var(--digital-text);
            font-family: 'VT323', monospace;
            font-size: 38px;
            line-height: 1;
            padding: 4px 12px;
            border-radius: 6px;
            width: 60px;
            text-align: center;
            letter-spacing: 2px;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.8);
        }

        #reset-btn {
            width: 45px;
            height: 45px;
            font-size: 24px;
            cursor: pointer;
            background: var(--cell-unrevealed);
            border: none;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: transform 0.1s, background 0.2s;
        }
        #reset-btn:active { transform: scale(0.92); }
        #reset-btn:hover { background: var(--cell-unrevealed-hover); }

        #board {
            display: grid;
            gap: 1.5px;
            background-color: var(--grid-gap-color);
            border: 1.5px solid var(--grid-gap-color);
            border-radius: 8px;
            overflow: hidden;
        }

        .cell {
            width: 28px;
            height: 28px;
            background-color: var(--cell-unrevealed);
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 800;
            font-size: 17px;
            cursor: pointer;
            box-sizing: border-box;
            box-shadow: inset 1px 1px 0 rgba(255,255,255,0.05);
            transition: background-color 0.1s;
        }
        .cell:hover:not(.revealed) { background-color: var(--cell-unrevealed-hover); }
        
        .cell.revealed {
            background-color: var(--cell-revealed);
            box-shadow: none; 
            cursor: default;
        }
        .cell.highlight {
            background-color: var(--cell-highlight);
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.4); 
        }
        .cell.mine { background-color: #ef4444 !important; }

        .record-header {
            text-align: center;
            margin-top: 0;
            margin-bottom: 20px;
            color: #fff;
            font-size: 24px;
            font-weight: 700;
        }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 15px; text-align: center;}
        th { color: var(--text-highlight); font-weight: 700; }
        td { color: #ddd; }
        
        .btn-back-game {
            display: block;
            margin: 30px auto 0;
            padding: 12px 30px;
            background: rgba(255,255,255,0.05);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.1);
            font-weight: bold;
            cursor: pointer;
            border-radius: 30px;
            font-size: 15px;
            transition: all 0.2s;
        }
        .btn-back-game:hover { 
            background: rgba(255,255,255,0.1); 
        }
    </style>
    
    <!-- 🟢 Firebase SDK 추가 -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <div class="top-header">
        <div class="logo">💣 Minesweeper Pro</div>
    </div>

    <div class="sidebar">
        <div class="sidebar-section">
            <button class="menu-btn" onclick="location.href='index.html'">🏠 메인으로 돌아가기</button>
        </div>
        <div style="height:1px; background:rgba(255,255,255,0.05); margin: 5px 20px;"></div>
        <div class="sidebar-section">
            <button class="menu-btn active" id="btn-mode-standard" onclick="toggleMode(false)">🎮 표준 모드</button>
            <button class="menu-btn" id="btn-mode-noguess" onclick="toggleMode(true)">🎯 추측 없이 모드</button>
        </div>
        <div style="height:1px; background:rgba(255,255,255,0.05); margin: 5px 20px;"></div>
        <div class="sidebar-section">
            <button class="menu-btn" id="btn-menu-record" onclick="openRecords()">🏆 역대 순위 (클라우드)</button>
        </div>
    </div>

    <div class="main-content">
        <div id="game-view">
            <div class="diff-nav">
                <button id="btn-초급" onclick="changeDiff('초급')">초급</button>
                <button id="btn-중급" onclick="changeDiff('중급')">중급</button>
                <button id="btn-고급" onclick="changeDiff('고급')">고급</button>
                <button id="btn-최상급" onclick="changeDiff('최상급')">최상급</button>
            </div>

            <div class="panel-wrapper">
                <div class="game-header">
                    <div class="digital-display" id="mine-count">010</div>
                    <button id="reset-btn" onclick="initGame()">🙂</button>
                    <div class="digital-display" id="timer">000</div>
                </div>
                <div id="board" oncontextmenu="return false;" ondragstart="return false;"></div>
            </div>
        </div>

        <div id="record-view">
            <div class="panel-wrapper">
                <h2 class="record-header">🏆 글로벌 최고 기록</h2>
                <table>
                    <thead>
                        <tr>
                            <th>난이도</th>
                            <th>표준 모드</th>
                            <th>추측 없이 모드</th>
                        </tr>
                    </thead>
                    <tbody id="record-tbody">
                        <tr><td colspan="3">데이터를 불러오는 중...</td></tr>
                    </tbody>
                </table>
                <button class="btn-back-game" onclick="closeRecords()">⬅️ 게임으로 돌아가기</button>
            </div>
        </div>
    </div>

<script>
    // 🟢 1. 파이어베이스 초기화 (아래 설정값을 본인의 프로젝트 정보로 변경해야 합니다)
    const firebaseConfig = {
        apiKey: "여기에_API_KEY_입력",
        authDomain: "여기에_PROJECT_ID.firebaseapp.com",
        databaseURL: "여기에_DATABASE_URL_입력", // 중요! Realtime Database URL
        projectId: "여기에_PROJECT_ID",
        storageBucket: "여기에_PROJECT_ID.appspot.com",
        messagingSenderId: "여기에_SENDER_ID_입력",
        appId: "여기에_APP_ID_입력"
    };
    
    // 파이어베이스 앱 초기화
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    // ---------------------------------
    // 기존 지뢰찾기 로직
    // ---------------------------------
    const difficulties = {
        '초급': { r: 9, c: 9, m: 10 },
        '중급': { r: 16, c: 16, m: 40 },
        '고급': { r: 16, c: 30, m: 99 },
        '최상급': { r: 24, c: 30, m: 160 }
    };

    const colors = [
        '', '#60a5fa', '#4ade80', '#f87171', 
         '#c084fc', '#fbbf24', '#2dd4bf', 
        '#d1d5db', '#9ca3af'
    ];

    let currentDiff = '초급';
    let isNoGuessMode = false;
    
    let ROWS, COLS, MINES;
    let board = [];
    let isFirstClick = true;
    let isGameOver = false;
    let minesLeft;
    let revealedCount;
    
    let timerInterval = null;
    let timeElapsed = 0;

    let isLeftMouseDown = false;
    let chordingCell = null;
    let highlightedCells = [];

    const boardElement = document.getElementById('board');
    const mineCountElement = document.getElementById('mine-count');
    const resetBtn = document.getElementById('reset-btn');
    const timerElement = document.getElementById('timer');

    window.addEventListener('mouseup', (e) => {
        if (e.button === 0) {
            isLeftMouseDown = false;
            if(!isGameOver) resetBtn.textContent = '🙂';
            clearAllHighlights();
        }
    });

    function getSaveKey() {
        return `ms_state_${currentDiff}_${isNoGuessMode ? 'noguess' : 'standard'}`;
    }

    function saveGameState() {
        const gameState = {
            board, isFirstClick, isGameOver, minesLeft, revealedCount, timeElapsed
        };
        localStorage.setItem(getSaveKey(), JSON.stringify(gameState));
        localStorage.setItem('ms_lastConfig', JSON.stringify({ diff: currentDiff, isNoGuessMode }));
    }

    function loadGameState() {
        const saved = localStorage.getItem(getSaveKey());
        if (!saved) return false;
        try {
            const gameState = JSON.parse(saved);
            board = gameState.board;
            isFirstClick = gameState.isFirstClick;
            isGameOver = gameState.isGameOver;
            minesLeft = gameState.minesLeft;
            revealedCount = gameState.revealedCount;
            timeElapsed = gameState.timeElapsed;

            ROWS = difficulties[currentDiff].r;
            COLS = difficulties[currentDiff].c;
            MINES = difficulties[currentDiff].m;

            clearInterval(timerInterval);
            boardElement.style.gridTemplateColumns = `repeat(${COLS}, 28px)`;
            boardElement.innerHTML = '';
            highlightedCells = [];
            chordingCell = null;
            isLeftMouseDown = false;

            updateMineCount();
            timerElement.textContent = String(timeElapsed).padStart(3, '0');
            
            if (isGameOver) {
                resetBtn.textContent = revealedCount === (ROWS * COLS - MINES) ? '😎' : '😵';
            } else {
                resetBtn.textContent = '🙂';
            }

            document.querySelectorAll('.diff-nav button').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`btn-${currentDiff}`).classList.add('active');
            setMenuActive(isNoGuessMode ? 'noguess' : 'standard');

            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    let cellData = board[r][c];
                    const cell = document.createElement('div');
                    cell.classList.add('cell');
                    cell.id = `cell-${r}-${c}`;

                    cell.addEventListener('mousedown', (e) => handleMouseDown(e, r, c));
                    cell.addEventListener('mouseenter', () => handleMouseEnter(r, c));
                    cell.addEventListener('mouseleave', () => handleMouseLeave(r, c));
                    cell.addEventListener('mouseup', (e) => handleMouseUp(e, r, c));
                    cell.addEventListener('contextmenu', (e) => {
                        e.preventDefault();
                        if(e.button === 2) handleRightClick(r, c);
                    });

                    if (cellData.isRevealed) {
                        cell.classList.add('revealed');
                        if (cellData.isMine) {
                            cell.innerHTML = '💣';
                        } else if (cellData.neighborMines > 0) {
                            cell.textContent = cellData.neighborMines;
                            cell.style.color = colors[cellData.neighborMines];
                        }
                    } else if (cellData.isFlagged) {
                        if (isGameOver && !cellData.isMine) {
                            cell.innerHTML = '❌';
                        } else {
                            cell.innerHTML = '<span style="color:#f87171; font-size:16px;">🚩</span>';
                        }
                    } else if (isGameOver && cellData.isMine) {
                        cell.classList.add('revealed');
                        cell.innerHTML = '💣';
                    }

                    boardElement.appendChild(cell);
                }
            }

            if (!isGameOver && !isFirstClick) {
                startTimer();
            }
            return true;
        } catch (e) {
            console.error("저장된 게임을 불러오는 데 실패했습니다:", e);
            return false;
        }
    }

    function setMenuActive(mode) {
        document.getElementById('btn-mode-standard').classList.remove('active');
        document.getElementById('btn-mode-noguess').classList.remove('active');
        document.getElementById('btn-menu-record').classList.remove('active');

        if(mode === 'standard') document.getElementById('btn-mode-standard').classList.add('active');
        else if(mode === 'noguess') document.getElementById('btn-mode-noguess').classList.add('active');
        else if(mode === 'record') document.getElementById('btn-menu-record').classList.add('active');
    }

    function toggleMode(isNoGuess) {
        document.getElementById('record-view').style.display = 'none';
        document.getElementById('game-view').style.display = 'flex';
        
        isNoGuessMode = isNoGuess;
        setMenuActive(isNoGuess ? 'noguess' : 'standard');
        
        if (!loadGameState()) {
            initGame();
        } else {
            saveGameState(); 
        }
    }

    function changeDiff(diff) {
        currentDiff = diff;
        document.querySelectorAll('.diff-nav button').forEach(btn => btn.classList.remove('active'));
        document.getElementById(`btn-${diff}`).classList.add('active');
        
        if (!loadGameState()) {
            initGame();
        } else {
            saveGameState(); 
        }
    }

    function initGame() {
        clearInterval(timerInterval);
        timeElapsed = 0;
        timerElement.textContent = '000';
        
        ROWS = difficulties[currentDiff].r;
        COLS = difficulties[currentDiff].c;
        MINES = difficulties[currentDiff].m;

        boardElement.style.gridTemplateColumns = `repeat(${COLS}, 28px)`;
        boardElement.innerHTML = '';
        
        board = [];
        isFirstClick = true;
        isGameOver = false;
        minesLeft = MINES;
        revealedCount = 0;
        isLeftMouseDown = false;
        chordingCell = null;
        highlightedCells = [];
        
        updateMineCount();
        resetBtn.textContent = '🙂';
        document.getElementById(`btn-${currentDiff}`).classList.add('active');

        for (let r = 0; r < ROWS; r++) {
            let row = [];
            for (let c = 0; c < COLS; c++) {
                row.push({ isMine: false, isRevealed: false, isFlagged: false, neighborMines: 0 });
                
                const cell = document.createElement('div');
                cell.classList.add('cell');
                cell.id = `cell-${r}-${c}`;
                
                cell.addEventListener('mousedown', (e) => handleMouseDown(e, r, c));
                cell.addEventListener('mouseenter', () => handleMouseEnter(r, c));
                cell.addEventListener('mouseleave', () => handleMouseLeave(r, c));
                cell.addEventListener('mouseup', (e) => handleMouseUp(e, r, c));
                cell.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    if(e.button === 2) handleRightClick(r, c);
                });
                
                boardElement.appendChild(cell);
            }
            board.push(row);
        }
        
        saveGameState(); 
    }

    function startTimer() {
        timerInterval = setInterval(() => {
            if(timeElapsed < 999) {
                timeElapsed++;
                timerElement.textContent = String(timeElapsed).padStart(3, '0');
                saveGameState(); 
            }
        }, 1000);
    }

    function updateMineCount() {
        let displayCount = minesLeft < 0 ? `-${String(Math.abs(minesLeft)).padStart(2, '0')}` : String(minesLeft).padStart(3, '0');
        mineCountElement.textContent = displayCount;
    }

    function placeMines(firstR, firstC) {
        let placedMines = 0;
        while (placedMines < MINES) {
            let r = Math.floor(Math.random() * ROWS);
            let c = Math.floor(Math.random() * COLS);
            
            if (board[r][c].isMine) continue;
            if (isNoGuessMode) {
                if (Math.abs(r - firstR) <= 1 && Math.abs(c - firstC) <= 1) continue;
            } else {
                if (r === firstR && c === firstC) continue;
            }
            board[r][c].isMine = true;
            placedMines++;
        }
        calculateNeighbors();
    }

    function calculateNeighbors() {
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                if (board[r][c].isMine) continue;
                let count = 0;
                getNeighbors(r, c).forEach(n => { if (board[n.r][n.c].isMine) count++; });
                board[r][c].neighborMines = count;
            }
        }
    }

    function getNeighbors(r, c) {
        let neighbors = [];
        for (let i = -1; i <= 1; i++) {
            for (let j = -1; j <= 1; j++) {
                if (i === 0 && j === 0) continue;
                let nr = r + i, nc = c + j;
                if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) {
                    neighbors.push({r: nr, c: nc});
                }
            }
        }
        return neighbors;
    }

    function clearAllHighlights() {
        highlightedCells.forEach(el => { if(el) el.classList.remove('highlight'); });
        highlightedCells = [];
    }

    function addHighlight(r, c) {
        let el = document.getElementById(`cell-${r}-${c}`);
        if (el && !board[r][c].isRevealed && !board[r][c].isFlagged) {
            el.classList.add('highlight');
            highlightedCells.push(el);
        }
    }

    function processDragHover(r, c) {
        clearAllHighlights();
        let cell = board[r][c];
        
        if (cell.isRevealed && cell.neighborMines > 0) {
            chordingCell = {r, c};
            getNeighbors(r, c).forEach(n => addHighlight(n.r, n.c));
        } else if (!cell.isRevealed && !cell.isFlagged) {
            chordingCell = null;
            addHighlight(r, c);
        } else {
            chordingCell = null;
        }
    }

    function handleMouseDown(e, r, c) {
        if (isGameOver) return;
        if (e.button === 0) {
            isLeftMouseDown = true;
            resetBtn.textContent = '😮';
            processDragHover(r, c);
        }
    }

    function handleMouseEnter(r, c) {
        if (isGameOver) return;
        if (isLeftMouseDown) {
            processDragHover(r, c);
        }
    }

    function handleMouseLeave(r, c) {
        if (isGameOver) return;
        if (isLeftMouseDown) {
            clearAllHighlights();
            chordingCell = null;
        }
    }

    function handleMouseUp(e, r, c) {
        if (isGameOver) return;
        if (e.button === 0) {
            let cellData = board[r][c];
            resetBtn.textContent = '🙂';
            
            if (chordingCell && chordingCell.r === r && chordingCell.c === c) {
                clearAllHighlights();
                let flags = 0;
                let neighbors = getNeighbors(r, c);
                neighbors.forEach(n => { if (board[n.r][n.c].isFlagged) flags++; });
                
                if (flags === cellData.neighborMines) {
                    neighbors.forEach(n => {
                        if (!board[n.r][n.c].isRevealed && !board[n.r][n.c].isFlagged) {
                            revealCell(n.r, n.c);
                        }
                    });
                    checkWin();
                }
                chordingCell = null;
                saveGameState(); 
            } else if (!cellData.isRevealed && !cellData.isFlagged) {
                clearAllHighlights();
                if (isFirstClick) {
                    isFirstClick = false;
                    startTimer();
                    placeMines(r, c);
                }
                revealCell(r, c);
                checkWin();
                saveGameState(); 
            } else {
                clearAllHighlights();
            }
        }
    }

    function handleRightClick(r, c) {
        if (isGameOver || board[r][c].isRevealed) return;
        let cellData = board[r][c];
        let cellElement = document.getElementById(`cell-${r}-${c}`);

        if (!cellData.isFlagged) {
            cellData.isFlagged = true;
            cellElement.innerHTML = '<span style="color:#f87171; font-size:16px;">🚩</span>';
            minesLeft--;
        } else {
            cellData.isFlagged = false;
            cellElement.innerHTML = '';
            minesLeft++;
        }
        updateMineCount();
        saveGameState(); 
    }

    function revealCell(r, c) {
        let cellData = board[r][c];
        if (cellData.isRevealed || cellData.isFlagged) return;

        cellData.isRevealed = true;
        revealedCount++;
        let cellElement = document.getElementById(`cell-${r}-${c}`);
        cellElement.classList.add('revealed');

        if (cellData.isMine) {
            gameOver(false, cellElement);
            return;
        }

        if (cellData.neighborMines > 0) {
            cellElement.textContent = cellData.neighborMines;
            cellElement.style.color = colors[cellData.neighborMines];
        } else {
            getNeighbors(r, c).forEach(n => revealCell(n.r, n.c));
        }
    }

    function checkWin() {
        if (!isGameOver && revealedCount === (ROWS * COLS - MINES)) {
            gameOver(true);
        }
    }

    function gameOver(isWin, triggerCell = null) {
        isGameOver = true;
        clearInterval(timerInterval);
        resetBtn.textContent = isWin ? '😎' : '😵';
        clearAllHighlights();
        
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                let cellEl = document.getElementById(`cell-${r}-${c}`);
                if (board[r][c].isMine) {
                    if (!board[r][c].isFlagged) {
                        cellEl.classList.add('revealed');
                        cellEl.innerHTML = '💣';
                        if (triggerCell && triggerCell.id === cellEl.id) {
                            cellEl.classList.add('mine'); 
                        }
                    }
                } else if (board[r][c].isFlagged) {
                    cellEl.innerHTML = '❌';
                }
            }
        }

        saveGameState(); 

        if (isWin) {
            setTimeout(() => {
                alert(`승리하셨습니다! 기록: ${timeElapsed}초`);
                saveRecordToCloud();
            }, 100);
        }
    }

    /* ---------------------------------
        🟢 클라우드 기록실 로직 (수정됨)
    --------------------------------- */
    function saveRecordToCloud() {
        let mode = isNoGuessMode ? 'noguess' : 'standard';
        
        // 데이터베이스 참조 경로 (예: minesweeper_records/초급/standard)
        const recordRef = db.ref(`minesweeper_records/${currentDiff}/${mode}`);
        
        recordRef.once('value').then((snapshot) => {
            let currentBest = snapshot.val();
            // 기존 기록이 없거나, 현재 기록이 더 빠르면(작으면) 업데이트
            if (currentBest === null || timeElapsed < currentBest) {
                recordRef.set(timeElapsed)
                    .then(() => console.log("새로운 클라우드 최고 기록 달성!"))
                    .catch((error) => console.error("기록 저장 실패: ", error));
            }
        });
    }

    function openRecords() {
        document.getElementById('game-view').style.display = 'none';
        document.getElementById('record-view').style.display = 'flex';
        setMenuActive('record');

        const tbody = document.getElementById('record-tbody');
        tbody.innerHTML = '<tr><td colspan="3">클라우드에서 기록을 불러오는 중...</td></tr>';

        // 데이터베이스에서 모든 기록 가져오기
        db.ref('minesweeper_records').once('value')
            .then((snapshot) => {
                let records = snapshot.val() || {};
                tbody.innerHTML = ''; // 로딩 메시지 삭제
                const diffList = ['초급', '중급', '고급', '최상급'];

                diffList.forEach(d => {
                    let tr = document.createElement('tr');
                    let tdDiff = document.createElement('td'); tdDiff.textContent = d;
                    let tdStd = document.createElement('td'); 
                    tdStd.textContent = records[d]?.standard ? `${records[d].standard}초` : '-';
                    let tdNoG = document.createElement('td'); 
                    tdNoG.textContent = records[d]?.noguess ? `${records[d].noguess}초` : '-';
                    
                    tr.appendChild(tdDiff);
                    tr.appendChild(tdStd);
                    tr.appendChild(tdNoG);
                    tbody.appendChild(tr);
                });
            })
            .catch((error) => {
                console.error("불러오기 실패:", error);
                tbody.innerHTML = '<tr><td colspan="3">기록을 불러오지 못했습니다. DB 설정을 확인해주세요.</td></tr>';
            });
    }

    function closeRecords() {
        document.getElementById('record-view').style.display = 'none';
        document.getElementById('game-view').style.display = 'flex';
        setMenuActive(isNoGuessMode ? 'noguess' : 'standard');
    }

    window.onload = () => { 
        const lastConfig = JSON.parse(localStorage.getItem('ms_lastConfig'));
        if (lastConfig) {
            currentDiff = lastConfig.diff || '초급';
            isNoGuessMode = lastConfig.isNoGuessMode || false;
        }

        if (!loadGameState()) {
            setMenuActive(isNoGuessMode ? 'noguess' : 'standard');
            initGame(); 
        }
    };
</script>

</body>
</html>
