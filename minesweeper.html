<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>지뢰찾기 Pro - Dark Edition</title>
    <style>
        /* 기본 폰트 및 디지털 시계 폰트 로드 */
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

        :root {
            --bg-main: #181a1b; /* 전체 배경 */
            --bg-sidebar: #222426; /* 사이드바 배경 */
            --text-main: #a0aab2; /* 기본 텍스트 */
            --text-highlight: #4da6ff; /* 사이드바 링크 색상 (블루) */
            
            /* 지뢰찾기 보드 색상 */
            --board-bg: #555555;
            --border-light: #7a7a7a;
            --border-dark: #333333;
            
            /* 셀 색상 */
            --cell-unrevealed: #5c5c5c;
            --cell-revealed: #3b3b3b;
            --cell-border-light: #7d7d7d;
            --cell-border-dark: #2a2a2a;
            --cell-border-revealed: #2d2d2d;
            
            /* 디지털 전광판 */
            --digital-bg: #111111;
            --digital-text: #ff1e1e;
        }

        body {
            font-family: 'Pretendard', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        /* ---------------------------------
           상단 로고 영역 (절대 위치)
        --------------------------------- */
        .top-header {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 50px;
            background-color: #1e1e1e;
            border-bottom: 1px solid #333;
            display: flex;
            align-items: center;
            padding: 0 20px;
            box-sizing: border-box;
            z-index: 10;
        }
        .top-header .logo {
            font-size: 20px;
            font-weight: bold;
            color: #ccc;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* ---------------------------------
           좌측 사이드바 (스크린샷 참고)
        --------------------------------- */
        .sidebar {
            width: 250px;
            background-color: var(--bg-sidebar);
            border-right: 1px solid #333;
            padding-top: 70px; /* 헤더 높이만큼 띄움 */
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-sizing: border-box;
        }
        
        .sidebar-section {
            display: flex;
            flex-direction: column;
            padding: 0 15px;
        }

        .menu-btn {
            background: none;
            border: none;
            color: var(--text-highlight);
            text-align: left;
            padding: 8px 10px;
            font-size: 14px;
            cursor: pointer;
            border-radius: 4px;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .menu-btn:before { content: '»'; font-size: 16px; }
        .menu-btn:hover { background-color: rgba(255,255,255,0.05); }
        .menu-btn.active { color: #fff; font-weight: bold; }

        .sidebar-divider {
            height: 1px;
            background-color: #333;
            margin: 10px 15px;
        }

        /* ---------------------------------
           메인 게임 영역
        --------------------------------- */
        .main-content {
            flex: 1;
            padding-top: 70px;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-y: auto;
        }

        .diff-nav {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }
        .diff-nav button {
            background: none;
            border: none;
            color: var(--text-highlight);
            font-size: 15px;
            cursor: pointer;
        }
        .diff-nav button.active { color: #fff; font-weight: bold; }

        /* 게임 보드 컨테이너 (클래식 3D 테두리) */
        #game-wrapper {
            background-color: var(--board-bg);
            padding: 12px;
            border-top: 3px solid var(--border-light);
            border-left: 3px solid var(--border-light);
            border-bottom: 3px solid var(--border-dark);
            border-right: 3px solid var(--border-dark);
            border-radius: 2px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: inline-block;
        }

        /* 상단 전광판 및 스마일 영역 */
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 10px;
            margin-bottom: 12px;
            border-top: 2px solid var(--border-dark);
            border-left: 2px solid var(--border-dark);
            border-bottom: 2px solid var(--border-light);
            border-right: 2px solid var(--border-light);
        }

        .digital-display {
            background-color: var(--digital-bg);
            color: var(--digital-text);
            font-family: 'VT323', monospace;
            font-size: 34px;
            line-height: 1;
            padding: 2px 6px;
            border-top: 2px solid var(--border-dark);
            border-left: 2px solid var(--border-dark);
            border-bottom: 2px solid var(--border-light);
            border-right: 2px solid var(--border-light);
            width: 50px;
            text-align: center;
            letter-spacing: 2px;
        }

        #reset-btn {
            width: 36px;
            height: 36px;
            font-size: 20px;
            cursor: pointer;
            background-color: #c0c0c0; /* 스마일 버튼은 클래식하게 밝은 회색 */
            border-top: 2px solid #fff;
            border-left: 2px solid #fff;
            border-bottom: 2px solid #777;
            border-right: 2px solid #777;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            margin: 0;
        }
        #reset-btn:active {
            border-top: 2px solid #777;
            border-left: 2px solid #777;
            border-bottom: 2px solid #fff;
            border-right: 2px solid #fff;
        }

        /* 지뢰찾기 격자 */
        #board {
            display: grid;
            border-top: 2px solid var(--border-dark);
            border-left: 2px solid var(--border-dark);
            border-bottom: 2px solid var(--border-light);
            border-right: 2px solid var(--border-light);
            background-color: var(--cell-border-revealed);
        }

        .cell {
            width: 24px;
            height: 24px;
            background-color: var(--cell-unrevealed);
            border-top: 2px solid var(--cell-border-light);
            border-left: 2px solid var(--cell-border-light);
            border-bottom: 2px solid var(--cell-border-dark);
            border-right: 2px solid var(--cell-border-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 900;
            font-size: 16px;
            cursor: pointer;
            box-sizing: border-box;
        }

        /* 열린 셀 및 하이라이트 셀 */
        .cell.revealed {
            border: 1px solid var(--cell-border-revealed);
            background-color: var(--cell-revealed);
            cursor: default;
        }
        .cell.highlight {
            border: 1px solid var(--cell-border-revealed);
            background-color: var(--cell-revealed);
        }
        .cell.mine {
            background-color: #ff3333 !important;
        }

        /* 기록실 모달 디자인 통일 */
        #record-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }
        .modal-content {
            background: var(--bg-sidebar);
            padding: 30px;
            border-radius: 8px;
            border: 1px solid #444;
            width: 450px;
            text-align: center;
            color: #ddd;
        }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; border-bottom: 1px solid #444; }
        th { color: var(--text-highlight); }
        .close-btn {
            margin-top: 20px; padding: 8px 20px;
            background: #333; color: #fff; border: 1px solid #555;
            cursor: pointer; border-radius: 4px;
        }
        .close-btn:hover { background: #444; }

    </style>
</head>
<body>

    <!-- 상단 헤더 -->
    <div class="top-header">
        <div class="logo">⚙️ Minesweeper.Online 스타일</div>
    </div>

    <!-- 좌측 사이드바 -->
    <div class="sidebar">
        <div class="sidebar-section">
            <button class="menu-btn" onclick="location.href='index.html'">메인으로 돌아가기</button>
        </div>
        <div class="sidebar-divider"></div>
        <div class="sidebar-section">
            <button class="menu-btn active" id="mode-standard" onclick="toggleMode(false)">표준 모드</button>
            <button class="menu-btn" id="mode-noguess" onclick="toggleMode(true)">추측 없이 모드</button>
        </div>
        <div class="sidebar-divider"></div>
        <div class="sidebar-section">
            <button class="menu-btn" onclick="openRecords()">역대 순위 (기록실)</button>
        </div>
    </div>

    <!-- 메인 게임 보드 영역 -->
    <div class="main-content">
        <!-- 난이도 선택 텍스트 메뉴 -->
        <div class="diff-nav">
            <button id="btn-초급" onclick="changeDiff('초급')">초급</button>
            <button id="btn-중급" onclick="changeDiff('중급')">중급</button>
            <button id="btn-고급" onclick="changeDiff('고급')">고급</button>
            <button id="btn-최상급" onclick="changeDiff('최상급')">최상급</button>
        </div>

        <div id="game-wrapper">
            <div class="game-header">
                <div class="digital-display" id="mine-count">010</div>
                <button id="reset-btn" onclick="initGame()">🙂</button>
                <div class="digital-display" id="timer">000</div>
            </div>
            <!-- 우클릭/드래그 방지 -->
            <div id="board" oncontextmenu="return false;" ondragstart="return false;"></div>
        </div>
    </div>

    <!-- 기록실 모달 -->
    <div id="record-modal">
        <div class="modal-content">
            <h2 style="margin-top:0;">🏆 내 최고 기록</h2>
            <table>
                <thead>
                    <tr>
                        <th>난이도</th>
                        <th>표준 모드</th>
                        <th>추측 없이 모드</th>
                    </tr>
                </thead>
                <tbody id="record-tbody"></tbody>
            </table>
            <button class="close-btn" onclick="closeRecords()">닫기</button>
        </div>
    </div>

<script>
    const difficulties = {
        '초급': { r: 9, c: 9, m: 10 },
        '중급': { r: 16, c: 16, m: 40 },
        '고급': { r: 16, c: 30, m: 99 },
        '최상급': { r: 24, c: 30, m: 160 }
    };

    // 다크 모드용 시인성 좋은 넘버 컬러
    const colors = ['', '#66b2ff', '#85e085', '#ff6666', '#c299ff', '#ff9933', '#33cccc', '#ff99cc', '#cccccc'];

    let currentDiff = '초급';
    let isNoGuessMode = false;
    
    let ROWS, COLS, MINES;
    let board = [];
    let isFirstClick = true;
    let isGameOver = false;
    let minesLeft;
    let revealedCount;
    
    let timerInterval = null;
    let timeElapsed = 0;

    const boardElement = document.getElementById('board');
    const mineCountElement = document.getElementById('mine-count');
    const resetBtn = document.getElementById('reset-btn');
    const timerElement = document.getElementById('timer');

    function toggleMode(isNoGuess) {
        isNoGuessMode = isNoGuess;
        document.getElementById('mode-standard').classList.toggle('active', !isNoGuess);
        document.getElementById('mode-noguess').classList.toggle('active', isNoGuess);
        initGame();
    }

    function changeDiff(diff) {
        currentDiff = diff;
        document.querySelectorAll('.diff-nav button').forEach(btn => btn.classList.remove('active'));
        document.getElementById(`btn-${diff}`).classList.add('active');
        initGame();
    }

    function initGame() {
        clearInterval(timerInterval);
        timeElapsed = 0;
        timerElement.textContent = '000';
        
        ROWS = difficulties[currentDiff].r;
        COLS = difficulties[currentDiff].c;
        MINES = difficulties[currentDiff].m;

        boardElement.style.gridTemplateColumns = `repeat(${COLS}, 24px)`;
        boardElement.innerHTML = '';
        
        board = [];
        isFirstClick = true;
        isGameOver = false;
        minesLeft = MINES;
        revealedCount = 0;
        
        updateMineCount();
        resetBtn.textContent = '🙂';

        // 초기 시작 시 난이도 버튼 활성화
        document.getElementById(`btn-${currentDiff}`).classList.add('active');

        for (let r = 0; r < ROWS; r++) {
            let row = [];
            for (let c = 0; c < COLS; c++) {
                row.push({ isMine: false, isRevealed: false, isFlagged: false, neighborMines: 0 });
                
                const cell = document.createElement('div');
                cell.classList.add('cell');
                cell.id = `cell-${r}-${c}`;
                
                cell.addEventListener('mousedown', (e) => handleMouseDown(e, r, c));
                cell.addEventListener('mouseup', (e) => handleMouseUp(e, r, c));
                cell.addEventListener('mouseleave', () => handleMouseLeave(r, c));
                cell.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    if(e.button === 2) handleRightClick(r, c);
                });
                
                boardElement.appendChild(cell);
            }
            board.push(row);
        }
    }

    function startTimer() {
        timerInterval = setInterval(() => {
            if(timeElapsed < 999) timeElapsed++;
            timerElement.textContent = String(timeElapsed).padStart(3, '0');
        }, 1000);
    }

    function updateMineCount() {
        let displayCount = minesLeft < 0 ? `-${String(Math.abs(minesLeft)).padStart(2, '0')}` : String(minesLeft).padStart(3, '0');
        mineCountElement.textContent = displayCount;
    }

    function placeMines(firstR, firstC) {
        let placedMines = 0;
        while (placedMines < MINES) {
            let r = Math.floor(Math.random() * ROWS);
            let c = Math.floor(Math.random() * COLS);
            
            if (board[r][c].isMine) continue;

            if (isNoGuessMode) {
                if (Math.abs(r - firstR) <= 1 && Math.abs(c - firstC) <= 1) continue;
            } else {
                if (r === firstR && c === firstC) continue;
            }

            board[r][c].isMine = true;
            placedMines++;
        }
        calculateNeighbors();
    }

    function calculateNeighbors() {
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                if (board[r][c].isMine) continue;
                let count = 0;
                getNeighbors(r, c).forEach(n => {
                    if (board[n.r][n.c].isMine) count++;
                });
                board[r][c].neighborMines = count;
            }
        }
    }

    function getNeighbors(r, c) {
        let neighbors = [];
        for (let i = -1; i <= 1; i++) {
            for (let j = -1; j <= 1; j++) {
                if (i === 0 && j === 0) continue;
                let nr = r + i, nc = c + j;
                if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) {
                    neighbors.push({r: nr, c: nc});
                }
            }
        }
        return neighbors;
    }

    let chordingCell = null;

    function handleMouseDown(e, r, c) {
        if (isGameOver) return;
        if (e.button === 0) {
            let cell = board[r][c];
            resetBtn.textContent = '😮';
            
            if (cell.isRevealed && cell.neighborMines > 0) {
                chordingCell = {r, c};
                getNeighbors(r, c).forEach(n => {
                    let nCell = board[n.r][n.c];
                    if (!nCell.isRevealed && !nCell.isFlagged) {
                        document.getElementById(`cell-${n.r}-${n.c}`).classList.add('highlight');
                    }
                });
            } else if (!cell.isRevealed && !cell.isFlagged) {
                document.getElementById(`cell-${r}-${c}`).classList.add('highlight');
            }
        }
    }

    function handleMouseLeave(r, c) {
        let el = document.getElementById(`cell-${r}-${c}`);
        if(el) el.classList.remove('highlight');
        
        if (chordingCell && chordingCell.r === r && chordingCell.c === c) {
            clearHighlight(r, c);
            chordingCell = null;
        }
    }

    function handleMouseUp(e, r, c) {
        if (isGameOver) return;
        resetBtn.textContent = '🙂';
        let el = document.getElementById(`cell-${r}-${c}`);
        if(el) el.classList.remove('highlight');

        if (e.button === 0) {
            let cell = board[r][c];
            
            if (chordingCell && chordingCell.r === r && chordingCell.c === c) {
                clearHighlight(r, c);
                let flags = 0;
                let neighbors = getNeighbors(r, c);
                neighbors.forEach(n => { if (board[n.r][n.c].isFlagged) flags++; });
                
                if (flags === cell.neighborMines) {
                    neighbors.forEach(n => {
                        if (!board[n.r][n.c].isRevealed && !board[n.r][n.c].isFlagged) {
                            revealCell(n.r, n.c);
                        }
                    });
                    checkWin();
                }
                chordingCell = null;
            } else if (!cell.isRevealed && !cell.isFlagged) {
                if (isFirstClick) {
                    isFirstClick = false;
                    startTimer();
                    placeMines(r, c);
                }
                revealCell(r, c);
                checkWin();
            }
        }
    }

    function clearHighlight(r, c) {
        getNeighbors(r, c).forEach(n => {
            let el = document.getElementById(`cell-${n.r}-${n.c}`);
            if (el) el.classList.remove('highlight');
        });
    }

    function handleRightClick(r, c) {
        if (isGameOver || board[r][c].isRevealed) return;
        let cellData = board[r][c];
        let cellElement = document.getElementById(`cell-${r}-${c}`);

        if (!cellData.isFlagged) {
            cellData.isFlagged = true;
            cellElement.innerHTML = '<span style="color:#ff4d4d; font-size:14px;">🚩</span>';
            minesLeft--;
        } else {
            cellData.isFlagged = false;
            cellElement.innerHTML = '';
            minesLeft++;
        }
        updateMineCount();
    }

    function revealCell(r, c) {
        let cellData = board[r][c];
        if (cellData.isRevealed || cellData.isFlagged) return;

        cellData.isRevealed = true;
        revealedCount++;
        let cellElement = document.getElementById(`cell-${r}-${c}`);
        cellElement.classList.add('revealed');

        if (cellData.isMine) {
            gameOver(false, cellElement);
            return;
        }

        if (cellData.neighborMines > 0) {
            cellElement.textContent = cellData.neighborMines;
            cellElement.style.color = colors[cellData.neighborMines];
        } else {
            getNeighbors(r, c).forEach(n => revealCell(n.r, n.c));
        }
    }

    function checkWin() {
        if (!isGameOver && revealedCount === (ROWS * COLS - MINES)) {
            gameOver(true);
        }
    }

    function gameOver(isWin, triggerCell = null) {
        isGameOver = true;
        clearInterval(timerInterval);
        resetBtn.textContent = isWin ? '😎' : '😵';
        
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                let cellEl = document.getElementById(`cell-${r}-${c}`);
                if (board[r][c].isMine) {
                    if (!board[r][c].isFlagged) {
                        cellEl.classList.add('revealed');
                        cellEl.innerHTML = '💣';
                        if (triggerCell && triggerCell.id === cellEl.id) {
                            cellEl.classList.add('mine');
                        }
                    }
                } else if (board[r][c].isFlagged) {
                    cellEl.innerHTML = '❌';
                }
            }
        }

        if (isWin) {
            setTimeout(() => {
                alert(`승리하셨습니다! 기록: ${timeElapsed}초`);
                saveRecord();
            }, 100);
        }
    }

    function saveRecord() {
        let mode = isNoGuessMode ? 'noguess' : 'standard';
        let records = JSON.parse(localStorage.getItem('ms_records')) || {};
        if (!records[currentDiff]) records[currentDiff] = {};
        
        let currentBest = records[currentDiff][mode];
        if (!currentBest || timeElapsed < currentBest) {
            records[currentDiff][mode] = timeElapsed;
            localStorage.setItem('ms_records', JSON.stringify(records));
        }
    }

    function openRecords() {
        const modal = document.getElementById('record-modal');
        const tbody = document.getElementById('record-tbody');
        tbody.innerHTML = '';

        let records = JSON.parse(localStorage.getItem('ms_records')) || {};
        const diffList = ['초급', '중급', '고급', '최상급'];

        diffList.forEach(d => {
            let tr = document.createElement('tr');
            let tdDiff = document.createElement('td'); tdDiff.textContent = d;
            let tdStd = document.createElement('td'); 
            tdStd.textContent = records[d]?.standard ? `${records[d].standard}초` : '-';
            let tdNoG = document.createElement('td'); 
            tdNoG.textContent = records[d]?.noguess ? `${records[d].noguess}초` : '-';
            
            tr.appendChild(tdDiff);
            tr.appendChild(tdStd);
            tr.appendChild(tdNoG);
            tbody.appendChild(tr);
        });

        modal.style.display = 'flex';
    }

    function closeRecords() {
        document.getElementById('record-modal').style.display = 'none';
    }

    // 창이 로드될 때 바로 게임 시작
    window.onload = () => {
        initGame();
    };
</script>

</body>
</html>
