<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>지뢰찾기 Pro - Modern Dark (Firestore)</title>
    <style>
        /* 폰트 로드 */
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        @import url('https://fonts.googleapis.com/css2?family=DSDIGIT&family=VT323&display=swap');

        :root {
            --bg-body: #121316;          
            --bg-sidebar: #1a1c20;       
            --bg-panel: #22252a;         
            
            --text-main: #8f959e;        
            --text-highlight: #60a5fa;   
            
            --grid-gap-color: #121316;   
            --cell-unrevealed: #3a3f47;  
            --cell-unrevealed-hover: #454b54; 
            --cell-revealed: #22252a;    
            --cell-highlight: #4d545e;   
            
            --digital-bg: #090a0c;
            --digital-text: #ef4444;

            /* 🟢 동적 셀 크기 (자바스크립트에서 난이도/화면크기에 맞춰 갱신) */
            --cell-size: 28px;
        }

        html, body {
            font-family: 'Pretendard', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            margin: 0;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        body {
            display: flex;
        }

        .top-header {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 60px;
            background-color: rgba(26, 28, 32, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            display: flex;
            align-items: center;
            padding: 0 30px;
            box-sizing: border-box;
            z-index: 10;
        }
        .top-header .logo {
            font-size: 22px;
            font-weight: 800;
            color: #fff;
            letter-spacing: -0.5px;
        }

        .sidebar {
            width: 260px;
            flex-shrink: 0;
            background-color: var(--bg-sidebar);
            border-right: 1px solid rgba(255,255,255,0.05);
            padding-top: 90px; 
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-sizing: border-box;
            height: 100vh;
        }
        
        .sidebar-section {
            display: flex;
            flex-direction: column;
            padding: 0 20px;
        }

        .menu-btn {
            background: none;
            border: none;
            color: var(--text-main);
            text-align: left;
            padding: 12px 15px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            border-radius: 12px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .menu-btn:hover { background-color: rgba(255,255,255,0.03); color: #fff; }
        .menu-btn.active { 
            background-color: rgba(96, 165, 250, 0.1); 
            color: var(--text-highlight); 
            font-weight: 700; 
        }

        /* 🟢 현재 모드를 보여주는 정적 라벨 (버튼 아님) */
        .mode-label {
            padding: 10px 15px;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-highlight);
            background-color: rgba(96, 165, 250, 0.08);
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .main-content {
            flex: 1;
            min-width: 0;
            height: 100vh;
            box-sizing: border-box;
            padding-top: 90px;
            padding-bottom: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            overflow: hidden;
        }

        #game-view {
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100%;
            box-sizing: border-box;
        }

        #record-view {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 600px;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .diff-nav {
            display: flex;
            background: var(--bg-sidebar);
            padding: 6px;
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.05);
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            flex-shrink: 0;
        }
        .diff-nav button {
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 14px;
            font-weight: 600;
            padding: 8px 24px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        .diff-nav button:hover { color: #fff; }
        .diff-nav button.active { 
            background: var(--text-highlight); 
            color: #fff; 
            box-shadow: 0 2px 10px rgba(96, 165, 250, 0.3);
        }

        .panel-wrapper {
            background-color: var(--bg-panel);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.05);
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
            max-width: calc(100vw - 320px);
            max-height: calc(100vh - 200px);
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.2);
            padding: 12px 20px;
            border-radius: 12px;
            margin-bottom: 15px;
            border: 1px solid rgba(255,255,255,0.02);
            width: 100%;
            box-sizing: border-box;
            flex-shrink: 0;
        }

        .digital-display {
            background-color: var(--digital-bg);
            color: var(--digital-text);
            font-family: 'VT323', monospace;
            font-size: 38px;
            line-height: 1;
            padding: 4px 12px;
            border-radius: 6px;
            width: 60px;
            text-align: center;
            letter-spacing: 2px;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.8);
        }

        #reset-btn {
            width: 45px;
            height: 45px;
            font-size: 24px;
            cursor: pointer;
            background: var(--cell-unrevealed);
            border: none;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: transform 0.1s, background 0.2s;
        }
        #reset-btn:active { transform: scale(0.92); }
        #reset-btn:hover { background: var(--cell-unrevealed-hover); }

        #board {
            display: grid;
            gap: 1.5px;
            background-color: var(--grid-gap-color);
            border: 1.5px solid var(--grid-gap-color);
            border-radius: 8px;
            overflow: hidden;
        }

        .cell {
            width: var(--cell-size);
            height: var(--cell-size);
            background-color: var(--cell-unrevealed);
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 800;
            font-size: calc(var(--cell-size) * 0.6);
            cursor: pointer;
            box-sizing: border-box;
            box-shadow: inset 1px 1px 0 rgba(255,255,255,0.05);
            transition: background-color 0.1s;
        }
        .cell:hover:not(.revealed) { background-color: var(--cell-unrevealed-hover); }
        
        .cell.revealed {
            background-color: var(--cell-revealed);
            box-shadow: none; 
            cursor: default;
        }
        .cell.highlight {
            background-color: var(--cell-highlight);
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.4); 
        }
        .cell.mine { background-color: #ef4444 !important; }

        /* 🟢 게임 시작 전 클릭해야 하는 시작 칸 표시 */
        .cell.start-cell {
            background-color: rgba(96, 165, 250, 0.18);
            color: var(--text-highlight);
            font-weight: 900;
            box-shadow: inset 0 0 0 2px var(--text-highlight);
        }

        /* 🟢 게임 시작 전에는 시작 칸 외 다른 칸은 클릭 불가 */
        #board.pre-game .cell:not(.start-cell) {
            pointer-events: none;
            opacity: 0.55;
            cursor: not-allowed;
        }

        .record-header {
            text-align: center;
            margin-top: 0;
            margin-bottom: 20px;
            color: #fff;
            font-size: 24px;
            font-weight: 700;
        }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 15px; text-align: center;}
        th { color: var(--text-highlight); font-weight: 700; }
        td { color: #ddd; }
        
        .btn-back-game {
            display: block;
            margin: 30px auto 0;
            padding: 12px 30px;
            background: rgba(255,255,255,0.05);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.1);
            font-weight: bold;
            cursor: pointer;
            border-radius: 30px;
            font-size: 15px;
            transition: all 0.2s;
        }
        .btn-back-game:hover { 
            background: rgba(255,255,255,0.1); 
        }

    </style>

    <!-- 🟢 Firebase SDK 추가 (Firestore용) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

</head>
<body>

    <!-- 상단 헤더 -->
    <div class="top-header">
        <div class="logo">💣 Minesweeper Pro</div>
    </div>

    <!-- 좌측 사이드바 -->
    <div class="sidebar">
        <div class="sidebar-section">
            <button class="menu-btn" onclick="location.href='index.html'">🏠 메인으로 돌아가기</button>
            <button class="menu-btn" onclick="location.href='games.html'">🎮 게임 목록으로</button>
        </div>
        <div style="height:1px; background:rgba(255,255,255,0.05); margin: 5px 20px;"></div>
        <div class="sidebar-section">
            <div class="mode-label">🎯 추측 없이 모드</div>
        </div>
        <div style="height:1px; background:rgba(255,255,255,0.05); margin: 5px 20px;"></div>
        <div class="sidebar-section">
            <button class="menu-btn" id="btn-menu-record" onclick="openRecords()">🏆 역대 순위 (클라우드)</button>
        </div>
    </div>

    <!-- 메인 콘텐츠 영역 -->
    <div class="main-content">
        
        <!-- 게임 화면 -->
        <div id="game-view">
            <div class="diff-nav">
                <button id="btn-초급" onclick="changeDiff('초급')">초급</button>
                <button id="btn-중급" onclick="changeDiff('중급')">중급</button>
                <button id="btn-고급" onclick="changeDiff('고급')">고급</button>
                <button id="btn-최상급" onclick="changeDiff('최상급')">최상급</button>
            </div>

            <div class="panel-wrapper">
                <div class="game-header">
                    <div class="digital-display" id="mine-count">010</div>
                    <button id="reset-btn" onclick="initGame()">🙂</button>
                    <div class="digital-display" id="timer">000</div>
                </div>
                <!-- 우클릭/드래그 방지 -->
                <div id="board" oncontextmenu="return false;" ondragstart="return false;"></div>
            </div>
        </div>

        <!-- 기록실 화면 -->
        <div id="record-view">
            <div class="panel-wrapper">
                <h2 class="record-header">🏆 글로벌 최고 기록 (추측 없이 모드)</h2>
                <table>
                    <thead>
                        <tr>
                            <th>난이도</th>
                            <th>최고 기록</th>
                        </tr>
                    </thead>
                    <tbody id="record-tbody"></tbody>
                </table>
                <button class="btn-back-game" onclick="closeRecords()">⬅️ 게임으로 돌아가기</button>
            </div>
        </div>

    </div>

<script>
    // ---------------------------------
    // 🟢 1. 파이어베이스 초기화 (Firestore)
    // ---------------------------------
    const firebaseConfig = {
            apiKey: "AIzaSyC1hcxeEpsGo-N75xyPxWb7RuTjspvpzNw",
            authDomain: "my-first-page-931dd.firebaseapp.com",
            projectId: "my-first-page-931dd",
            storageBucket: "my-first-page-931dd.firebasestorage.app",
            messagingSenderId: "905407958433",
            appId: "1:905407958433:web:e9ea7fa164807ad8ebcfe0"
    };
    
    // 파이어베이스 앱 초기화
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    // ---------------------------------
    // 기존 지뢰찾기 로직
    // ---------------------------------
    const difficulties = {
        '초급': { r: 9, c: 9, m: 10 },
        '중급': { r: 16, c: 16, m: 40 },
        '고급': { r: 16, c: 30, m: 99 },
        '최상급': { r: 24, c: 30, m: 160 }
    };

    const colors = [
        '', '#60a5fa', '#4ade80', '#f87171', 
         '#c084fc', '#fbbf24', '#2dd4bf', 
        '#d1d5db', '#9ca3af'
    ];

    let currentDiff = '초급';
    // 🟢 이제 모드는 항상 "추측 없이"로 고정됩니다.
    const isNoGuessMode = true;
    
    let ROWS, COLS, MINES;
    let board = [];
    let isFirstClick = true;
    let isGameOver = false;
    let minesLeft;
    let revealedCount;
    
    let timerInterval = null;
    let timeElapsed = 0;

    let isLeftMouseDown = false;
    let chordingCell = null;
    let highlightedCells = [];
    let startCell = null; // 🟢 게임 시작 전 클릭해야 하는 칸 (X 표시)

    const boardElement = document.getElementById('board');
    const mineCountElement = document.getElementById('mine-count');
    const resetBtn = document.getElementById('reset-btn');
    const timerElement = document.getElementById('timer');

    window.addEventListener('mouseup', (e) => {
        if (e.button === 0) {
            isLeftMouseDown = false;
            if(!isGameOver) resetBtn.textContent = '🙂';
            clearAllHighlights();
        }
    });

    // ---------------------------------
    // 🟢 2. 화면 크기에 맞춰 셀 크기를 자동으로 계산 (스크롤 없이 한 화면에 표시)
    // ---------------------------------
    function calcCellSize(rows, cols) {
        const sidebarWidth = 260;
        const horizontalBuffer = 100;  // panel padding + 여백
        const verticalBuffer = 90 + 50 + 90 + 40; // top-header + diff-nav + game-header + 여백

        const availWidth = window.innerWidth - sidebarWidth - horizontalBuffer;
        const availHeight = window.innerHeight - verticalBuffer;

        let size = Math.floor(Math.min(availWidth / cols, availHeight / rows));
        size = Math.max(13, Math.min(28, size)); // 13px ~ 28px 사이로 제한
        return size;
    }

    function updateCellSize() {
        if (!ROWS || !COLS) return;
        const size = calcCellSize(ROWS, COLS);
        document.documentElement.style.setProperty('--cell-size', size + 'px');
        boardElement.style.gridTemplateColumns = `repeat(${COLS}, var(--cell-size))`;
    }

    window.addEventListener('resize', updateCellSize);

    // ---------------------------------
    // 🟢 3. 시작 칸(X) 표시 및 게임 시작 전 클릭 차단
    // ---------------------------------
    function getStartCell(rows, cols) {
        return { r: Math.floor(rows / 2), c: Math.floor(cols / 2) };
    }

    // 시작 칸에 X 마커를 표시하고, 보드에 pre-game 클래스를 달아 다른 칸 클릭을 막습니다.
    function applyPreGameMarker() {
        startCell = getStartCell(ROWS, COLS);
        boardElement.classList.add('pre-game');
        const el = document.getElementById(`cell-${startCell.r}-${startCell.c}`);
        if (el) {
            el.classList.add('start-cell');
            el.textContent = '✕';
        }
    }

    // 첫 클릭이 일어나면 더 이상 칸을 막지 않습니다.
    function clearPreGameBlocking() {
        boardElement.classList.remove('pre-game');
    }

    function getSaveKey() {
        return `ms_state_${currentDiff}_noguess`;
    }

    function saveGameState() {
        const gameState = {
            board, isFirstClick, isGameOver, minesLeft, revealedCount, timeElapsed
        };
        localStorage.setItem(getSaveKey(), JSON.stringify(gameState));
        localStorage.setItem('ms_lastConfig', JSON.stringify({ diff: currentDiff }));
    }

    function loadGameState() {
        const saved = localStorage.getItem(getSaveKey());
        if (!saved) return false;

        try {
            const gameState = JSON.parse(saved);
            board = gameState.board;
            isFirstClick = gameState.isFirstClick;
            isGameOver = gameState.isGameOver;
            minesLeft = gameState.minesLeft;
            revealedCount = gameState.revealedCount;
            timeElapsed = gameState.timeElapsed;

            ROWS = difficulties[currentDiff].r;
            COLS = difficulties[currentDiff].c;
            MINES = difficulties[currentDiff].m;

            clearInterval(timerInterval);
            updateCellSize();
            boardElement.innerHTML = '';
            highlightedCells = [];
            chordingCell = null;
            isLeftMouseDown = false;

            updateMineCount();
            timerElement.textContent = String(timeElapsed).padStart(3, '0');
            
            if (isGameOver) {
                resetBtn.textContent = revealedCount === (ROWS * COLS - MINES) ? '😎' : '😵';
            } else {
                resetBtn.textContent = '🙂';
            }

            document.querySelectorAll('.diff-nav button').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`btn-${currentDiff}`).classList.add('active');

            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    let cellData = board[r][c];
                    const cell = document.createElement('div');
                    cell.classList.add('cell');
                    cell.id = `cell-${r}-${c}`;

                    cell.addEventListener('mousedown', (e) => handleMouseDown(e, r, c));
                    cell.addEventListener('mouseenter', () => handleMouseEnter(r, c));
                    cell.addEventListener('mouseleave', () => handleMouseLeave(r, c));
                    cell.addEventListener('mouseup', (e) => handleMouseUp(e, r, c));
                    cell.addEventListener('contextmenu', (e) => {
                        e.preventDefault();
                        if(e.button === 2) handleRightClick(r, c);
                    });

                    if (cellData.isRevealed) {
                        cell.classList.add('revealed');
                        if (cellData.isMine) {
                            cell.innerHTML = '💣';
                        } else if (cellData.neighborMines > 0) {
                            cell.textContent = cellData.neighborMines;
                            cell.style.color = colors[cellData.neighborMines];
                        }
                    } else if (cellData.isFlagged) {
                        if (isGameOver && !cellData.isMine) {
                            cell.innerHTML = '❌';
                        } else {
                            cell.innerHTML = '<span style="color:#f87171; font-size:0.9em;">🚩</span>';
                        }
                    } else if (isGameOver && cellData.isMine) {
                        cell.classList.add('revealed');
                        cell.innerHTML = '💣';
                    }

                    boardElement.appendChild(cell);
                }
            }

            if (!isGameOver && !isFirstClick) {
                startTimer();
            }

            // 🟢 아직 첫 클릭 전이면 시작 칸(X) 표시 및 다른 칸 클릭 차단
            if (!isGameOver && isFirstClick) {
                applyPreGameMarker();
            }
            return true;

        } catch (e) {
            console.error("저장된 게임을 불러오는 데 실패했습니다:", e);
            return false;
        }
    }

    function setMenuActive(mode) {
        document.getElementById('btn-menu-record').classList.remove('active');
        if(mode === 'record') document.getElementById('btn-menu-record').classList.add('active');
    }

    function changeDiff(diff) {
        currentDiff = diff;
        document.querySelectorAll('.diff-nav button').forEach(btn => btn.classList.remove('active'));
        document.getElementById(`btn-${diff}`).classList.add('active');
        
        if (!loadGameState()) {
            initGame();
        } else {
            saveGameState(); 
        }
    }

    function initGame() {
        clearInterval(timerInterval);
        timeElapsed = 0;
        timerElement.textContent = '000';
        
        ROWS = difficulties[currentDiff].r;
        COLS = difficulties[currentDiff].c;
        MINES = difficulties[currentDiff].m;

        updateCellSize();
        boardElement.innerHTML = '';
        
        board = [];
        isFirstClick = true;
        isGameOver = false;
        minesLeft = MINES;
        revealedCount = 0;
        isLeftMouseDown = false;
        chordingCell = null;
        highlightedCells = [];
        
        updateMineCount();
        resetBtn.textContent = '🙂';
        document.getElementById(`btn-${currentDiff}`).classList.add('active');

        for (let r = 0; r < ROWS; r++) {
            let row = [];
            for (let c = 0; c < COLS; c++) {
                row.push({ isMine: false, isRevealed: false, isFlagged: false, neighborMines: 0 });
                
                const cell = document.createElement('div');
                cell.classList.add('cell');
                cell.id = `cell-${r}-${c}`;
                
                cell.addEventListener('mousedown', (e) => handleMouseDown(e, r, c));
                cell.addEventListener('mouseenter', () => handleMouseEnter(r, c));
                cell.addEventListener('mouseleave', () => handleMouseLeave(r, c));
                cell.addEventListener('mouseup', (e) => handleMouseUp(e, r, c));
                cell.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    if(e.button === 2) handleRightClick(r, c);
                });
                
                boardElement.appendChild(cell);
            }
            board.push(row);
        }
        
        // 🟢 시작 칸(X) 표시 및 다른 칸 클릭 차단
        applyPreGameMarker();

        saveGameState(); 
    }

    function startTimer() {
        timerInterval = setInterval(() => {
            if(timeElapsed < 999) {
                timeElapsed++;
                timerElement.textContent = String(timeElapsed).padStart(3, '0');
                saveGameState(); 
            }
        }, 1000);
    }

    function updateMineCount() {
        let displayCount = minesLeft < 0 ? `-${String(Math.abs(minesLeft)).padStart(2, '0')}` : String(minesLeft).padStart(3, '0');
        mineCountElement.textContent = displayCount;
    }

    function placeMines(firstR, firstC) {
        let placedMines = 0;
        while (placedMines < MINES) {
            let r = Math.floor(Math.random() * ROWS);
            let c = Math.floor(Math.random() * COLS);
            
            if (board[r][c].isMine) continue;
            // 추측 없이 모드: 첫 클릭 주변 3x3은 항상 안전
            if (Math.abs(r - firstR) <= 1 && Math.abs(c - firstC) <= 1) continue;
            board[r][c].isMine = true;
            placedMines++;
        }
        calculateNeighbors();
    }

    function calculateNeighbors() {
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                if (board[r][c].isMine) continue;
                let count = 0;
                getNeighbors(r, c).forEach(n => { if (board[n.r][n.c].isMine) count++; });
                board[r][c].neighborMines = count;
            }
        }
    }

    function getNeighbors(r, c) {
        let neighbors = [];
        for (let i = -1; i <= 1; i++) {
            for (let j = -1; j <= 1; j++) {
                if (i === 0 && j === 0) continue;
                let nr = r + i, nc = c + j;
                if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) {
                    neighbors.push({r: nr, c: nc});
                }
            }
        }
        return neighbors;
    }

    function clearAllHighlights() {
        highlightedCells.forEach(el => { if(el) el.classList.remove('highlight'); });
        highlightedCells = [];
    }

    function addHighlight(r, c) {
        let el = document.getElementById(`cell-${r}-${c}`);
        if (el && !board[r][c].isRevealed && !board[r][c].isFlagged) {
            el.classList.add('highlight');
            highlightedCells.push(el);
        }
    }

    function processDragHover(r, c) {
        clearAllHighlights();
        let cell = board[r][c];
        
        if (cell.isRevealed && cell.neighborMines > 0) {
            chordingCell = {r, c};
            getNeighbors(r, c).forEach(n => addHighlight(n.r, n.c));
        } else if (!cell.isRevealed && !cell.isFlagged) {
            chordingCell = null;
            addHighlight(r, c);
        } else {
            chordingCell = null;
        }
    }

    function handleMouseDown(e, r, c) {
        if (isGameOver) return;
        if (e.button === 0) {
            isLeftMouseDown = true;
            resetBtn.textContent = '😮';
            processDragHover(r, c);
        }
    }

    function handleMouseEnter(r, c) {
        if (isGameOver) return;
        if (isLeftMouseDown) {
            processDragHover(r, c);
        }
    }

    function handleMouseLeave(r, c) {
        if (isGameOver) return;
        if (isLeftMouseDown) {
            clearAllHighlights();
            chordingCell = null;
        }
    }

    function handleMouseUp(e, r, c) {
        if (isGameOver) return;
        if (e.button === 0) {
            let cellData = board[r][c];
            resetBtn.textContent = '🙂';
            
            if (chordingCell && chordingCell.r === r && chordingCell.c === c) {
                clearAllHighlights();
                let flags = 0;
                let neighbors = getNeighbors(r, c);
                neighbors.forEach(n => { if (board[n.r][n.c].isFlagged) flags++; });
                
                if (flags === cellData.neighborMines) {
                    neighbors.forEach(n => {
                        if (!board[n.r][n.c].isRevealed && !board[n.r][n.c].isFlagged) {
                            revealCell(n.r, n.c);
                        }
                    });
                    checkWin();
                }
                chordingCell = null;
                saveGameState(); 
            } else if (!cellData.isRevealed && !cellData.isFlagged) {
                clearAllHighlights();
                if (isFirstClick) {
                    isFirstClick = false;
                    startTimer();
                    placeMines(r, c);
                    clearPreGameBlocking();
                }
                revealCell(r, c);
                checkWin();
                saveGameState(); 
            } else {
                clearAllHighlights();
            }
        }
    }

    function handleRightClick(r, c) {
        if (isGameOver || board[r][c].isRevealed) return;
        if (isFirstClick) return; // 🟢 첫 클릭(시작 칸) 전에는 깃발도 표시할 수 없음
        let cellData = board[r][c];
        let cellElement = document.getElementById(`cell-${r}-${c}`);

        if (!cellData.isFlagged) {
            cellData.isFlagged = true;
            cellElement.innerHTML = '<span style="color:#f87171; font-size:0.9em;">🚩</span>';
            minesLeft--;
        } else {
            cellData.isFlagged = false;
            cellElement.innerHTML = '';
            minesLeft++;
        }
        updateMineCount();
        saveGameState(); 
    }

    function revealCell(r, c) {
        let cellData = board[r][c];
        if (cellData.isRevealed || cellData.isFlagged) return;

        cellData.isRevealed = true;
        revealedCount++;
        let cellElement = document.getElementById(`cell-${r}-${c}`);
        cellElement.classList.remove('start-cell'); // 🟢 X 마커 흔적 제거
        cellElement.classList.add('revealed');
        cellElement.textContent = ''; // 🟢 X 텍스트도 확실히 비워줌 (0칸일 때 안 지워지는 버그 방지)

        if (cellData.isMine) {
            gameOver(false, cellElement);
            return;
        }

        if (cellData.neighborMines > 0) {
            cellElement.textContent = cellData.neighborMines;
            cellElement.style.color = colors[cellData.neighborMines];
        } else {
            getNeighbors(r, c).forEach(n => revealCell(n.r, n.c));
        }
    }

    function checkWin() {
        if (!isGameOver && revealedCount === (ROWS * COLS - MINES)) {
            gameOver(true);
        }
    }

    function gameOver(isWin, triggerCell = null) {
        isGameOver = true;
        clearInterval(timerInterval);
        resetBtn.textContent = isWin ? '😎' : '😵';
        clearAllHighlights();
        
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                let cellEl = document.getElementById(`cell-${r}-${c}`);
                if (board[r][c].isMine) {
                    if (!board[r][c].isFlagged) {
                        cellEl.classList.add('revealed');
                        cellEl.innerHTML = '💣';
                        if (triggerCell && triggerCell.id === cellEl.id) {
                            cellEl.classList.add('mine'); 
                        }
                    }
                } else if (board[r][c].isFlagged) {
                    cellEl.innerHTML = '❌';
                }
            }
        }

        saveGameState(); 

        if (isWin) {
            setTimeout(() => {
                alert(`승리하셨습니다! 기록: ${timeElapsed}초`);
                saveRecordToCloud();
            }, 100);
        }
    }

    /* ---------------------------------
        🟢 Cloud Firestore 전용 기록실 로직 (추측 없이 모드만 기록)
    --------------------------------- */
    function saveRecordToCloud() {
        const docRef = db.collection('minesweeper_records').doc(currentDiff);
        
        docRef.get().then((doc) => {
            let data = doc.exists ? doc.data() : {};
            let currentBest = data.noguess;
            
            // 기존 기록이 없거나, 현재 기록이 더 빠르면 업데이트
            if (currentBest === undefined || timeElapsed < currentBest) {
                docRef.set({
                    noguess: timeElapsed
                }, { merge: true })
                .then(() => console.log("새로운 클라우드 최고 기록 달성! (Firestore)"))
                .catch((error) => console.error("기록 저장 실패: ", error));
            }
        });
    }

    function openRecords() {
        document.getElementById('game-view').style.display = 'none';
        document.getElementById('record-view').style.display = 'flex';
        setMenuActive('record');

        const tbody = document.getElementById('record-tbody');
        tbody.innerHTML = '<tr><td colspan="2">클라우드에서 기록을 불러오는 중...</td></tr>';

        // Firestore에서 기록 가져오기
        db.collection('minesweeper_records').get()
            .then((querySnapshot) => {
                let records = {};
                querySnapshot.forEach((doc) => {
                    records[doc.id] = doc.data(); 
                });

                tbody.innerHTML = '';
                const diffList = ['초급', '중급', '고급', '최상급'];

                diffList.forEach(d => {
                    let tr = document.createElement('tr');
                    let tdDiff = document.createElement('td'); tdDiff.textContent = d;
                    let tdNoG = document.createElement('td'); 
                    tdNoG.textContent = records[d]?.noguess ? `${records[d].noguess}초` : '-';
                    
                    tr.appendChild(tdDiff);
                    tr.appendChild(tdNoG);
                    tbody.appendChild(tr);
                });
            })
            .catch((error) => {
                console.error("불러오기 실패:", error);
                tbody.innerHTML = '<tr><td colspan="2">기록을 불러오지 못했습니다. DB 설정을 확인해주세요.</td></tr>';
            });
    }

    function closeRecords() {
        document.getElementById('record-view').style.display = 'none';
        document.getElementById('game-view').style.display = 'flex';
        setMenuActive(null);
    }

    window.onload = () => { 
        const lastConfig = JSON.parse(localStorage.getItem('ms_lastConfig'));
        if (lastConfig) {
            currentDiff = lastConfig.diff || '초급';
        }

        if (!loadGameState()) {
            initGame(); 
        }
    };
</script>
